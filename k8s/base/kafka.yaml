apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: chat-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        deleteClaim: false
        kraftMetadata: shared
---
# kafka cluster
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: chat-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
---
# topic
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: chat-messages
  labels:
    strimzi.io/cluster: chat-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 604800000