apiVersion: v1
kind: Service
metadata:
  name: chat-api
  labels:
    app: chat-api            # lets the ServiceMonitor find it later
spec:
  selector:
    app: chat-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
    spec:
      containers:
        - name: chat-api
          image: chat-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: password }
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/chat
            - name: KAFKA_BROKER_URL
              value: chat-kafka-kafka-bootstrap:9092   # Kafka comes later
            - name: APP_VERSION
              value: "dev"
            - name: GIT_COMMIT
              value: "unknown"
          livenessProbe:
            httpGet: { path: /kubernetes/liveness, port: 8000 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /kubernetes/ready, port: 8000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }