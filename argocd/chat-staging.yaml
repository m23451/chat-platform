apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/m23451/chat-platform.git
    targetRevision: develop
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true